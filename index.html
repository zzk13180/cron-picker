<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cron Picker</title>
  <script type="module" src="/src/cron-picker.ts"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    header {
      padding: 60px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.05rem;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 响应式操场 */
    .playground-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .resize-area {
      padding: 40px;
      background-color: #f1f5f9;
      background-image: 
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    .resizable-wrapper {
      width: 100%;
      min-width: 350px;
      max-width: 1000px;
      margin: 0 auto;
      resize: horizontal;
      overflow: hidden;
      position: relative;
      padding-bottom: 24px; /* Handle space */
      transition: width 0.1s;
    }

    .resizable-wrapper::after {
      content: '↔ 拖拽右下角调整宽度，测试响应式布局';
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      text-align: center;
      background: rgba(0,0,0,0.05);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 4px;
      border-radius: 4px;
      font-weight: 500;
    }

    .component-host {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      overflow: hidden;
    }

    .controls {
      padding: 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 场景 Grid */
    .scenarios {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 32px;
    }

    .scenario-item {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mock-window {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      height: 500px;
    }

    .mock-header {
      background: #f8fafc;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
    .dot.red { background: #fee2e2; border: 1px solid #fecaca; }
    .dot.yellow { background: #fef9c3; border: 1px solid #fde047; }
    .dot.green { background: #dcfce7; border: 1px solid #86efac; }
    
    .mock-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* 侧边栏场景 */
    .sidebar-layout {
      display: flex;
      height: 100%;
    }
    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .sidebar-title { padding: 20px; font-weight: bold; font-size: 14px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 0; }
    .main-area { flex: 1; background: #f1f5f9; padding: 32px; }
    .skeleton { height: 200px; background: #cbd5e1; border-radius: 12px; opacity: 0.2; }

    /* 弹窗场景 */
    .dialog-overlay {
      background: rgba(0,0,0,0.5);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .dialog-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 100%;
    }
    .dialog-header { padding: 16px 20px; font-weight: bold; border-bottom: 1px solid var(--border); }
    .dialog-content { padding: 0; overflow-y: auto; }
    .dialog-footer { padding: 12px 20px; border-top: 1px solid var(--border); text-align: right; }

    /* 代码展示 */
    .value-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      color: var(--primary);
      font-weight: 700;
      padding: 8px 16px;
      background: #eff6ff;
      border-radius: 6px;
      border: 1px solid #dbeafe;
    }

    @media (max-width: 640px) {
      h1 { font-size: 2rem; }
      .resize-area { padding: 20px; }
      .scenarios { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="layout">
  <header>
    <h1>Cron Picker</h1>
    <p class="subtitle">现代化、响应式、无依赖的 Cron 表达式生成组件。</p>
  </header>

  <!-- 动态响应式演示 -->
  <section>
    <div class="playground-card">
      <div class="resize-area">
        <div class="resizable-wrapper" id="resize-wrapper">
          <div class="component-host">
            <cron-picker id="playground-picker" mode="advanced"></cron-picker>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="control-group">
          <span style="font-size: 14px; font-weight:600; color:var(--text-secondary)">预设宽度:</span>
          <button class="btn" onclick="resize(360)">360px (窄屏)</button>
          <button class="btn" onclick="resize(600)">600px (平板)</button>
          <button class="btn active" onclick="resize('100%')">100% (自适应)</button>
        </div>
        <div style="flex:1"></div>
        <div class="value-display" id="playground-value">* * * * * *</div>
      </div>
    </div>
  </section>

  <div class="scenarios">
    <!-- 场景 1: 侧边栏应用 -->
    <div class="scenario-item">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        侧边栏集成 (Compact)
      </h2>
      <div class="mock-window">
        <div class="mock-header">
          <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        </div>
        <div class="mock-body sidebar-layout">
          <div class="sidebar">
            <div class="sidebar-title">定时任务配置</div>
            <div class="sidebar-content">
              <!-- 这里强制开启紧凑模式 -->
              <cron-picker mode="advanced" compact></cron-picker>
            </div>
          </div>
          <div class="main-area">
            <div class="skeleton"></div>
            <div class="skeleton" style="margin-top: 20px; height: 100px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 场景 2: 弹窗对话框 -->
    <div class="scenario-item">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        弹窗面板 (Fixed Height)
      </h2>
      <div class="mock-window" style="background-image: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80'); background-size: cover;">
        <div class="dialog-overlay">
          <div class="dialog-box">
            <div class="dialog-header">设置执行时间</div>
            <div class="dialog-content">
              <!-- 移动/窄屏优化 -->
              <cron-picker mode="simple" compact></cron-picker>
            </div>
            <div class="dialog-footer">
              <button class="btn active">保存配置</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // Playground 逻辑
  const wrapper = document.getElementById('resize-wrapper');
  const picker = document.getElementById('playground-picker');
  const valueDisplay = document.getElementById('playground-value');
  const btns = document.querySelectorAll('.controls .btn');

  // 监听值变化
  picker.addEventListener('change', (e) => {
    valueDisplay.textContent = e.detail.value;
  });

  // 调整宽度函数
  window.resize = (width) => {
    if (width === '100%') {
      wrapper.style.width = '100%';
      wrapper.style.maxWidth = '1000px';
    } else {
      wrapper.style.width = width + 'px';
      wrapper.style.maxWidth = width + 'px'; // 强制 override
    }
    
    // 更新按钮状态
    btns.forEach(btn => btn.classList.remove('active'));
    const targetBtn = Array.from(btns).find(b => {
      const w = typeof width === 'string' ? width : width + 'px';
      return b.innerText.includes(typeof width === 'number' ? width : '自适应');
    });
    if (targetBtn) targetBtn.classList.add('active');
  };
</script>

</body>
</html>
